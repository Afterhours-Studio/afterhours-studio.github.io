<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterhours Studio</title>
<meta name="description" content="Afterhours Studio is an independent mobile game studio.">
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5c5c; --line: #e2e2e2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #e8e8e8; --muted: #a0a0a0; --line: #2e2e2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: fit-content; max-width: 100%; padding: 48px 20px; text-align: center; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  h1 { font-size: min(40px, calc((100vw - 40px) / 8.5)); line-height: 1.15; margin: 0 0 16px; white-space: nowrap; }
  .lede { color: var(--muted); line-height: 1.6; margin: 0 0 28px; }
  nav { border-top: 1px solid var(--line); padding-top: 20px; display: flex; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
  nav a { color: var(--fg); font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Independent game development</p>
  <h1>Afterhours Studio</h1>
  <p class="lede">Mobile games made out of passion,<br>for relaxing after a long day at work.</p>
  <nav>
    <a href="/privacy/">Privacy Policy</a>
    <a href="/terms/">Terms of Use</a>
    <a href="mailto:h1dr0n@icloud.com">Contact</a>
    <a href="https://github.com/Afterhours-Studio" rel="noopener">GitHub</a>
  </nav>
</div>
</body>
</html>
